pan><span class="essay-title">Today makes tommorow</span><span class="meta">11/19/2026</span></a></li></ol><section class="about" id="about"><h2>Henry Lani</h2></section></main><footer><span>© 2026 Henry Lani</span><a href="#top">Back to top</a></footer></div><script>
const homeHTML="<main id=\"main\" tabindex=\"-1\"><div id=\"top\"><\/div><ol class=\"essay-list\"><li><a class=\"essay-link\" href=\"#essay/running-towards-fear\"><span class=\"index\">002<\/span><span class=\"essay-title\">Running towards fear<\/span><span class=\"meta\">11/20/2026<\/span><\/a><\/li><li><a class=\"essay-link\" href=\"#essay/today-makes-tommorow\"><span class=\"index\">001<\/span><span class=\"essay-title\">Today makes tommorow<\/span><span class=\"meta\">11/19/2026<\/span><\/a><\/li><\/ol><section class=\"about\" id=\"about\"><h2>Henry Lani<\/h2><\/section><\/main>";
const articles={"today-makes-tommorow":{"html":"<main id=\"main\" class=\"reading\" tabindex=\"-1\"><div id=\"top\"><\/div><a class=\"back\" href=\"#home\">All essays<\/a><h1>Today makes tommorow<\/h1><time class=\"label\" datetime=\"2026-11-19\">11/19/2026<\/time><article class=\"body\"><p>Who I am 10 years into the future will be completely my fault, and  if I don&#x27;t become someone my current self would be proud of, I have no one to blame but myself. If I don&#x27;t stop myself from being lazy and neglecting to do the things necessary to actually accomplish anything valuable in that amount of time, I would have wasted arguably 10 of the most valuable years of my life. The scary thing is that most of the time it&#x27;s extremely hard to notice how much time I&#x27;m wasting.<\/p><p>When I think about progress in my life I always project the thought of me doing something productive or meaningful years into the future, but if I never stop to think that if I don&#x27;t start doing those things now, then I never will. Just think of how many years I&#x27;ve talked about starting a business, yet I still haven&#x27;t built one.<\/p><p>However I don&#x27;t believe in starting businesses just for the sake of starting a business, especially if it&#x27;s just to make money, but rather I want to build a company that I genuinely believe could have a major positive impact in people&#x27;s lives. That being said, that doesn&#x27;t mean I shouldn&#x27;t start smaller projects that have a positive impact, even if the scale is extremely small, and iv&#x27;e yet to even do that.<\/p><p>The Henry of the future will be built by the Henry of today, and if everyday single day I don&#x27;t work towards building something my future self will be proud, I will end up in the exact same spot I started, and I won&#x27;t be able to live with the result.<\/p><\/article><\/main>","title":"Today makes tommorow — Henry Lani"},"running-towards-fear":{"html":"<main id=\"main\" class=\"reading\" tabindex=\"-1\"><div id=\"top\"><\/div><a class=\"back\" href=\"#home\">All essays<\/a><h1>Running towards fear<\/h1><time class=\"label\" datetime=\"2026-11-20\">11/20/2026<\/time><article class=\"body\"><p>I think that doing things you are severely uncomfortable with leads to the largest amount of growth in our life. I know that&#x27;s something repeated a lot, but it&#x27;s harder to do in practice than in theory. This is something I especially need to focus on. Discomfort is usually a good indicator for knowing wether to go for something or not to. I know I&#x27;ll become much more desensitized to the things I fear now by constantly attacking and embracing those fears. The more I run from things I&#x27;m afraid of, the more afraid I&#x27;ll be. Whereas if I run at what scares me, then the less scary it will gradually become.  Obviously it&#x27;s good to have some fears, but I seriously and jokingly think that a lot of fears we have exist to scare us away from a much better life. In other words maybe its an illusion. Regardless of the cliches, fear truly does exist in the mind, not reality. Overall I think a good solution for anyone is to favor running towards their fears rather than away, because the faster we run the harder it is to escape.<\/p><\/article><\/main>","title":"Running towards fear — Henry Lani"}};
